name: Four-engine OneLake versus local Parquet diagnosis

# One physical hosted runner for all engines and scenarios. The job copies the
# original SF10 Iceberg Parquet to ephemeral runner storage, but never publishes
# the data files or commits results. Local files are a CPU/plan control, not a
# claim that Iceberg and read_parquet are identical execution paths.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onelake
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: '1'
  TPCH_SF: '10'
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install original catalog and engine adapters
        run: |
          pip install -r requirements/catalog.txt -r requirements/duckdb_iceberg.txt \
            -r requirements/polars_iceberg.txt 'chdb==4.4.0' 'psutil>=6'

      - name: Pin main Linux x86_64 chdb-core CI wheel
        id: core
        env:
          GH_TOKEN: ${{ secrets.CHDB_CORE_ARTIFACT_TOKEN }}
        run: |
          python .github/scripts/resolve_chdb_core_ci.py
          WHEEL=$(find "$RUNNER_TEMP/chdb-core-ci" -maxdepth 1 -name 'chdb_core-*.whl' -type f -print -quit)
          test -n "$WHEEL"
          pip install --force-reinstall --no-deps "$WHEEL"
          pip check
          pip show chdb chdb-core | grep -E '^(Name|Version):'
          mkdir -p diagnosis
          cp "$RUNNER_TEMP/chdb-core-ci/provenance.json" diagnosis/core-provenance.json

      - uses: ./.github/actions/duckdb-nightly
        id: duckdb
        with:
          run-id: '37917233558'

      - name: Pin official ClickHouse Local 26.9.17.8
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/clickhouse-common-static-26.9.17.8-amd64.tgz" \
            'https://github.com/ClickHouse/ClickHouse/releases/download/v26.9.17.8-stable/clickhouse-common-static-26.9.17.8-amd64.tgz'
          cd "$RUNNER_TEMP"
          echo '6fc6b563c18d140d6f7d96eb0ffdf90fb28b1730ea009dade2d11586a4f234619a891ab920a389f9af06cd5b12719026f1ffda633bd999754f7eaefe1a57e458  clickhouse-common-static-26.9.17.8-amd64.tgz' | sha512sum --check
          mkdir -p clickhouse-install clickhouse-bin
          tar -xf clickhouse-common-static-26.9.17.8-amd64.tgz -C clickhouse-install
          ln -s "$RUNNER_TEMP/clickhouse-install/clickhouse-common-static-26.9.17.8/usr/bin/clickhouse" clickhouse-bin/clickhouse
          echo "$RUNNER_TEMP/clickhouse-bin" >> "$GITHUB_PATH"

      - name: Record exact machine and versions
        run: |
          lscpu | grep -E 'Architecture:|CPU\(s\):|Model name:'
          free -h
          df -h "$RUNNER_TEMP"
          python --version
          duckdb --version
          clickhouse local --version

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Stage original CH0010 Parquet bytes, not a generated substitute
        run: |
          python .github/scripts/download_tpch_parquet.py \
            "$RUNNER_TEMP/tpch-sf10-source" diagnosis/manifest.json

      - name: CPU-only control before the measured scenarios
        run: python .github/scripts/cpu_control.py diagnosis/cpu-control-before.json

      - name: Measure local then remote on this SAME runner
        shell: bash
        run: |
          status=0
          for engine in duckdb_iceberg polars_iceberg chdb_iceberg clickhouse_local_iceberg; do
            for scenario in local remote; do
              python .github/scripts/io_diagnosis.py \
                --engine "$engine" --scenario "$scenario" \
                --data "$RUNNER_TEMP/tpch-sf10-source" \
                --out "diagnosis/${engine}-${scenario}.json" || status=1
            done
          done
          exit "$status"

      - name: CPU-only control after the measured scenarios
        if: always()
        run: python .github/scripts/cpu_control.py diagnosis/cpu-control-after.json

      - uses: azure/login@v3
        if: always()
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify source snapshots did not change
        if: always()
        run: |
          if [ -f diagnosis/manifest.json ]; then
            python .github/scripts/download_tpch_parquet.py \
              --verify diagnosis/manifest.json \
              --verify-output diagnosis/snapshot-verification.json
          fi

      - name: Generate bounded one-shot summary
        if: always()
        run: |
          status=0
          python .github/scripts/summarize_io_diagnosis.py diagnosis || status=$?
          if [ -f diagnosis/report.md ]; then
            cat diagnosis/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sf10-one-run-local-versus-onelake-diagnosis
          path: diagnosis/
          if-no-files-found: warn
          retention-days: 90
