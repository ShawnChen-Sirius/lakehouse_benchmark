name: Cross-engine Q7/Q21 local versus OneLake profile

# Targeted diagnostics, NOT a published timing benchmark. Original Parquet is
# staged once on an ephemeral runner. Raw SQL, DuckDB JSON profiles and native
# query/processor logs stay under RUNNER_TEMP and are never uploaded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onelake
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: '1'
  TPCH_SF: '10'
  AZURE_TRANSPORT_OPTION_TYPE: curl
  CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install original catalog and three engines
        run: |
          pip install -r requirements/catalog.txt -r requirements/duckdb_iceberg.txt \
            -r requirements/polars_iceberg.txt 'chdb==4.4.0' 'psutil>=6'

      # Reuse the exact upstream-main wheel which produced the paired baseline,
      # rather than silently resolving a newer core while investigating a gap.
      - uses: actions/download-artifact@v6
        with:
          name: paired-pinned-chdb-core-wheel
          run-id: 38338000796
          repository: ShawnChen-Sirius/lakehouse_benchmark
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-core-wheel
      - uses: actions/download-artifact@v6
        with:
          name: paired-sf10-three-round-summary
          run-id: 38338000796
          repository: ShawnChen-Sirius/lakehouse_benchmark
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-summary
      - uses: actions/download-artifact@v6
        with:
          name: paired-sf10-chdb_iceberg-round-1
          run-id: 38338000796
          repository: ShawnChen-Sirius/lakehouse_benchmark
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-summary/chdb-round-1
      - name: Verify and install baseline core
        run: |
          WHEEL=$(find "$RUNNER_TEMP/baseline-core-wheel" -maxdepth 1 -name 'chdb_core-*.whl' -type f -print -quit)
          test -n "$WHEEL"
          test "$(sha256sum "$WHEEL" | cut -d' ' -f1)" = '5cd62aa6237965c081097c19e56c310401ac53c8448b45c9cd08c7e0abd5528a'
          pip install --force-reinstall --no-deps "$WHEEL"
          pip check
          mkdir -p profile-results
          cp "$RUNNER_TEMP/baseline-core-wheel/provenance.json" profile-results/core-provenance.json
          pip show chdb chdb-core | grep -E '^(Name|Version):'

      - uses: ./.github/actions/duckdb-nightly
        with:
          run-id: '37917233558'
      - name: Pin official ClickHouse Local 26.9.17.8
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/clickhouse-common-static-26.9.17.8-amd64.tgz" \
            'https://github.com/ClickHouse/ClickHouse/releases/download/v26.9.17.8-stable/clickhouse-common-static-26.9.17.8-amd64.tgz'
          cd "$RUNNER_TEMP"
          echo '6fc6b563c18d140d6f7d96eb0ffdf90fb28b1730ea009dade2d11586a4f234619a891ab920a389f9af06cd5b12719026f1ffda633bd999754f7eaefe1a57e458  clickhouse-common-static-26.9.17.8-amd64.tgz' | sha512sum --check
          mkdir -p clickhouse-install clickhouse-bin
          tar -xf clickhouse-common-static-26.9.17.8-amd64.tgz -C clickhouse-install
          ln -s "$RUNNER_TEMP/clickhouse-install/clickhouse-common-static-26.9.17.8/usr/bin/clickhouse" clickhouse-bin/clickhouse
          echo "$RUNNER_TEMP/clickhouse-bin" >> "$GITHUB_PATH"
      - name: Record exact machine and package versions
        run: |
          lscpu | grep -E 'Architecture:|CPU\(s\):|Model name:'
          free -h
          df -h "$RUNNER_TEMP"
          duckdb --version
          clickhouse local --version
          pip list --format=freeze > profile-results/python-packages.txt

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Stage original Parquet for the local scan-path control
        run: |
          python .github/scripts/download_tpch_parquet.py \
            "$RUNNER_TEMP/tpch-sf10-source" profile-results/manifest.json
      - name: CPU-only control before profiling
        run: python .github/scripts/cpu_control.py profile-results/cpu-control-before.json

      - name: Same-runner unprofiled baseline for lateral comparison
        shell: bash
        run: |
          status=0
          for engine in duckdb_iceberg polars_iceberg chdb_iceberg clickhouse_local_iceberg; do
            for scenario in local remote; do
              python .github/scripts/io_diagnosis.py --timing-only \
                --engine "$engine" --scenario "$scenario" \
                --data "$RUNNER_TEMP/tpch-sf10-source" \
                --out "profile-results/baseline-${engine}-${scenario}.json" || status=1
            done
          done
          exit "$status"

      - name: Profile Q1-3/Q7/Q21 in complete 22-query order
        shell: bash
        run: |
          status=0
          for engine in duckdb_iceberg polars_iceberg chdb_iceberg; do
            for scenario in local remote; do
              python .github/scripts/cross_engine_profile.py \
                --engine "$engine" --scenario "$scenario" \
                --data "$RUNNER_TEMP/tpch-sf10-source" \
                --out "profile-results/${engine}-${scenario}.json" || status=1
            done
          done
          exit "$status"

      - name: CPU-only control after profiling
        if: always()
        run: python .github/scripts/cpu_control.py profile-results/cpu-control-after.json
      - uses: azure/login@v3
        if: always()
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify Iceberg snapshots did not move
        if: always()
        run: |
          if [ -f profile-results/manifest.json ]; then
            python .github/scripts/download_tpch_parquet.py \
              --verify profile-results/manifest.json \
              --verify-output profile-results/snapshot-verification.json
          fi

      - name: Produce bounded horizontal comparison
        if: always()
        run: |
          status=0
          python .github/scripts/summarize_cross_engine_profile.py \
            profile-results "$RUNNER_TEMP/baseline-summary" || status=$?
          if [ -f profile-results/report.md ]; then
            cat profile-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cross-engine-q7-q21-profile-summary
          path: profile-results/
          if-no-files-found: warn
          retention-days: 90
